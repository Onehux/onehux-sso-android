# onehux-sso-android/gradle/libs.versions.toml
# All versions resolved fresh from Google Maven / Maven Central on 2026-10-07 — see
# onehux-pos-android's own libs.versions.toml (sibling project, same owner) for the identical
# AGP/Kotlin/KSP baseline this was built against.

[versions]
kotlin = "2.4.20"
agp = "9.4.1"
ksp = "2.3.12"

coreKtx = "1.19.1"
browser = "1.10.0"          # Chrome Custom Tabs
activity = "1.13.0"         # Activity Result API for redirect capture
lifecycleRuntimeKtx = "2.11.0" # lifecycleScope, used to collect the redirect bus
datastore = "1.2.1"          # encrypted session storage (paired with Tink below)
tink = "1.23.0"              # Keystore-backed AEAD for token storage

okhttp = "5.5.0"
kotlinxSerializationJson = "1.11.0"
kotlinxCoroutines = "1.11.0"
nimbusJoseJwt = "10.10"      # RS256 verification + JWK/JWKS parsing

detekt = "1.23.8"
spotless = "8.9.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "browser" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
tink-android = { module = "com.google.crypto.tink:tink-android", version.ref = "tink" }

okhttp-core = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbusJoseJwt" }

kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# NOTE: no kotlin-android plugin — AGP 9's built-in Kotlin compiles the :android module
# natively (same lesson as onehux-pos-android's own build; see its STATUS.md).
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
