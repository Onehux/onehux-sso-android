org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=false
# Reduced heap + --no-daemon (passed on the command line) is a workaround for this specific
# dev machine's severe memory constraints (observed repeatedly while building the sibling
# onehux-pos-android project — see that repo's docs/ai/STATUS.md). Raise toward 4g on a
# machine/CI with real headroom; a public SDK repo's own CI should use the real default.
org.gradle.jvmargs=-Xmx768m -Dfile.encoding=UTF-8
# Same dev-machine memory constraint as above — the Kotlin compiler's own daemon is a
# separate JVM process that otherwise tries to reserve its own default-sized heap and fails
# to even start under this machine's limited free RAM. Raise/remove this alongside the
# org.gradle.jvmargs line above on a machine/CI with real headroom.
kotlin.daemon.jvmargs=-Xmx512m
android.useAndroidX=true
kotlin.code.style=official
